services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stt}
      POSTGRES_DB: stt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stt']
      interval: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://stt:${DB_PASSWORD:-stt}@db:5432/stt
      STT_PROVIDER: ${STT_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080'

volumes:
  pgdata:
